[project]
name = "vllm-experiments"
version = "0.1.0"
description = "A portfolio of infrastructure experiments for LLM serving using vLLM"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    # Core vLLM and inference
    "vllm>=0.15.1",
    "transformers==*",
    "torch>=2.10.0",

    # API and UI
    "streamlit>=1.28.0",
    "requests>=2.31.0",
    "uvicorn>=0.24.0",
    "openai>=1.0.0",

    # Visualization and analysis
    "matplotlib>=3.5.0",
    "numpy>=1.21.0",
]

[tool.uv.sources]
torch = [
  { index = "pytorch-cu130", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true



[project.optional-dependencies]
quantization = [
    "autoawq>=0.1.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"