[project]
name = "vllm-experiments"
version = "0.1.0"
description = "A portfolio of infrastructure experiments for LLM serving using vLLM"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    # Core vLLM and inference
    "vllm>=0.2.0",
    "transformers>=4.35.0",
    "torch>=2.0.0",
    
    # API and UI
    "streamlit>=1.28.0",
    "requests>=2.31.0",
    "uvicorn>=0.24.0",
    "openai>=1.0.0",
    
    # Visualization and analysis
    "matplotlib>=3.5.0",
    "numpy>=1.21.0",
]

[project.optional-dependencies]
quantization = [
    "autoawq>=0.1.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
dev-dependencies = []
